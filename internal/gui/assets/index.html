      (function () {
        try {
          var theme = localStorage.getItem('loom.theme');
          if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
          var size = parseInt(localStorage.getItem('loom.textSize') || '100', 10);
          if (size >= 100) document.documentElement.style.setProperty('--zoom', String(size / 100));
        } catch (e) {}
      })();
    </script>
